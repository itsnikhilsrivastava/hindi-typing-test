<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Hindi Typing Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>हिंदी मंगल टाइपिंग मास्टर (Exam Pro)</h2>
        
        <!-- Setup Screen -->
        <div id="setup-screen" class="card">
            <input type="text" id="user-name" placeholder="अपना नाम लिखें">
            <div class="options">
                <select id="time-limit">
                    <option value="60">1 मिनट</option>
                    <option value="300" selected>5 मिनट (परीक्षा)</option>
                    <option value="600">10 मिनट</option>
                </select>
                <select id="font-size-select">
                    <option value="22px">छोटा</option>
                    <option value="28px" selected>मध्यम</option>
                    <option value="34px">बड़ा</option>
                </select>
            </div>
            <button id="start-btn" class="btn-primary">टेस्ट शुरू करें</button>
        </div>

        <!-- Test Screen -->
        <div id="test-screen" class="hidden">
            <div class="stats-bar">
                <span>👤 <span id="display-name"></span></span>
                <span>⏱️ <span id="timer">00:00</span></span>
                <span>WPM: <span id="live-wpm">0</span></span>
            </div>
            
            <div id="text-display" class="text-box"></div>
            
            <input type="text" id="text-input" placeholder="यहाँ टाइप करें और स्पेस दबाएँ..." autocomplete="off">
            
            <div class="controls">
                <button id="submit-btn" class="btn-danger">सबमिट (Submit)</button>
                <button onclick="location.reload()" class="btn-secondary">रीसेट</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden card">
            <h1 id="status-icon"></h1>
            <h2 id="status-message"></h2>
            <div class="result-grid" id="result-data"></div>
            <button class="btn-primary" onclick="location.reload()">नया टेस्ट</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
